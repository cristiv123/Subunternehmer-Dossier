<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subunternehmer-Dossier</title>
<meta name="description" content="Subunternehmer-Dossier — the main contractor's subcontractor file under Swiss joint liability: status computed per document, the whole chain, on-site checks, Excel import. A demo with invented data.">
<meta property="og:title" content="Subunternehmer-Dossier">
<meta property="og:description" content="The subcontractor file under Swiss joint liability, as a web application. A demo with invented data.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#F5F6F9;
    --surface:#FFFFFF;
    --surface-2:#EFF1F6;
    --ink:#14181F;
    --ink-2:#464E5D;
    --ink-3:#6A7382;
    --rule:#DBDFE7;
    --rule-strong:#C3C9D4;
    --accent:#0E6E85;
    --accent-soft:#E3F2F6;
    --signal:#0F6F66;
    --signal-soft:#E4F2F0;

    --f-display:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    --f-body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --gut:clamp(1rem,4vw,3rem);
    --maxw:72rem;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#0C0F15;
      --surface:#131822;
      --surface-2:#1A2029;
      --ink:#E8ECF3;
      --ink-2:#A7B0BF;
      --ink-3:#838C9E;
      --rule:#242B37;
      --rule-strong:#333C4B;
      --accent:#5CC8DE;
      --accent-soft:#10303A;
      --signal:#4FCFBD;
      --signal-soft:#11302D;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#0C0F15; --surface:#131822; --surface-2:#1A2029;
    --ink:#E8ECF3; --ink-2:#A7B0BF; --ink-3:#838C9E;
    --rule:#242B37; --rule-strong:#333C4B;
    --accent:#5CC8DE; --accent-soft:#10303A;
    --signal:#4FCFBD; --signal-soft:#11302D;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--f-body); font-size:1rem; line-height:1.62;
    font-feature-settings:"kern" 1;
  }
  img{max-width:100%}
  a{color:var(--accent); text-underline-offset:.18em; text-decoration-thickness:.06em}
  a:hover{text-decoration-thickness:.12em}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
  code{font-family:var(--f-mono); font-size:.88em; background:var(--surface-2); padding:.08em .32em; border-radius:3px}
  em{font-style:italic}

  .wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gut)}

  /* ---------- top bar ---------- */
  .bar{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--rule);
    padding-block:.6rem;
    padding-top:calc(.6rem + env(safe-area-inset-top,0px));
  }
  .bar__in{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap}
  .mark{
    font-family:var(--f-mono); font-weight:600; font-size:.78rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
    display:flex; align-items:center; gap:.55rem;
  }
  .mark i{width:.5rem; height:.5rem; background:var(--accent); display:block; flex:none}
  .langs{display:flex; gap:.15rem}
  .langs button{
    font-family:var(--f-mono); font-size:.72rem; font-weight:500; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3);
    background:transparent; border:1px solid transparent; border-radius:3px;
    padding:.34rem .5rem; cursor:pointer; line-height:1;
  }
  .langs button:hover{color:var(--ink)}
  .langs button[aria-pressed="true"]{color:var(--accent); border-color:var(--rule-strong); background:var(--surface)}

  /* ---------- hero ---------- */
  .hero{padding-block:clamp(2.75rem,7vw,5.5rem) clamp(2rem,5vw,3.5rem)}
  .eyebrow{
    font-family:var(--f-mono); font-size:.72rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); margin:0 0 1.4rem;
  }
  h1{
    font-family:var(--f-display); font-weight:700;
    font-size:clamp(3rem,11vw,6.5rem); line-height:.92; letter-spacing:-.02em;
    margin:0 0 1.6rem; text-wrap:balance;
  }
  .deck{
    font-size:clamp(1.06rem,2.1vw,1.3rem); line-height:1.55; color:var(--ink-2);
    max-width:46ch; margin:0 0 2.6rem;
  }
  .deck strong{color:var(--ink); font-weight:600}

  .facts{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));
    gap:1px; background:var(--rule); border-block:1px solid var(--rule);
  }
  .fact{background:var(--paper); padding:.95rem 1rem .95rem 0}
  .facts .fact:not(:first-child){padding-left:1rem}
  .fact dt{
    font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-3); margin:0 0 .35rem;
  }
  .fact dd{margin:0; font-family:var(--f-display); font-weight:600; font-size:1.02rem; line-height:1.3}

  .stack{
    margin-top:1.6rem; font-family:var(--f-mono); font-size:.76rem; line-height:2.1;
    color:var(--ink-3); word-spacing:.1em;
  }
  .stack b{color:var(--ink-2); font-weight:500}

  /* ---------- figures ---------- */
  figure{margin:0}
  .shot{
    display:block; width:100%; height:auto;
    border:1px solid var(--rule-strong); border-radius:4px; background:var(--surface);
    box-shadow:0 1px 2px rgba(15,20,30,.05), 0 10px 30px rgba(15,20,30,.07);
  }
  figcaption{
    margin-top:.9rem; display:grid; grid-template-columns:4.5rem minmax(0,1fr); gap:0 1rem;
    font-size:.9rem; color:var(--ink-2); line-height:1.58; max-width:62ch;
  }
  figcaption b{
    font-family:var(--f-mono); font-size:.7rem; font-weight:500; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); padding-top:.22rem;
  }
  .hero-figure{margin-top:clamp(2rem,4vw,2.75rem)}
  .gallery{display:grid; gap:clamp(2.25rem,4.5vw,3.25rem)}

  /* ---------- sections ---------- */
  section{padding-block:clamp(2.75rem,6vw,4.75rem); border-top:1px solid var(--rule-strong)}
  .s-head{display:grid; grid-template-columns:6.5rem minmax(0,1fr); gap:0 2rem; margin-bottom:2.4rem}
  .s-num{
    font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; color:var(--accent);
    padding-top:.45rem;
  }
  h2{
    font-family:var(--f-display); font-weight:700; font-size:clamp(1.6rem,3.4vw,2.25rem);
    line-height:1.12; letter-spacing:-.01em; margin:0 0 .85rem; text-wrap:balance;
  }
  .lead{margin:0; color:var(--ink-2); max-width:58ch; font-size:1.02rem}

  /* capabilities */
  .caps{display:grid; grid-template-columns:repeat(auto-fit,minmax(17rem,1fr)); gap:1px; background:var(--rule)}
  .cap{background:var(--surface); padding:1.5rem 1.4rem}
  .cap h3{
    font-family:var(--f-mono); font-size:.72rem; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); margin:0 0 .7rem;
  }
  .cap p{margin:0; font-size:.95rem; color:var(--ink-2); line-height:1.6}

  /* clauses */
  .clause{
    display:grid; grid-template-columns:6.5rem minmax(0,1fr); gap:0 2rem;
    border-top:1px solid var(--rule); padding-block:1.9rem;
  }
  .clause:last-child{border-bottom:1px solid var(--rule)}
  .clause__i{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; color:var(--accent); padding-top:.4rem}
  .clause h3{
    font-family:var(--f-display); font-weight:600; font-size:1.18rem; line-height:1.28;
    margin:0 0 .7rem; letter-spacing:-.005em;
  }
  .clause p{margin:0; color:var(--ink-2); max-width:64ch}
  .measure{
    margin-top:1rem !important; padding:.75rem .9rem;
    border-left:2px solid var(--signal); background:var(--signal-soft);
    font-family:var(--f-mono); font-size:.79rem; line-height:1.62; color:var(--ink-2);
  }
  .measure em{font-style:normal; color:var(--ink); font-weight:500}

  /* ledger */
  .ledger-wrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; min-width:32rem}
  th,td{text-align:left; padding:.85rem .6rem; border-bottom:1px solid var(--rule); vertical-align:baseline}
  thead th{
    font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-3); font-weight:500; border-bottom-color:var(--rule-strong); padding-top:0;
  }
  td.k{font-family:var(--f-display); font-weight:600; font-size:1rem; white-space:nowrap}
  td.v{
    font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:500;
    font-size:1.12rem; color:var(--accent); text-align:right; white-space:nowrap; width:1%;
  }
  td.n{color:var(--ink-2); font-size:.92rem}
  tbody tr:last-child td{border-bottom:none}

  /* diagram */
  .layer{border-top:1px solid var(--rule); padding-block:1.35rem; display:grid; grid-template-columns:6.5rem minmax(0,1fr); gap:0 2rem}
  .layer:last-of-type{border-bottom:1px solid var(--rule)}
  .layer__l{font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding-top:.5rem}
  .nodes{display:flex; flex-wrap:wrap; gap:.5rem}
  .node{
    font-family:var(--f-mono); font-size:.79rem; color:var(--ink);
    border:1px solid var(--rule-strong); background:var(--surface);
    padding:.42rem .7rem; border-radius:3px;
  }
  .node.core{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .node.local{border-color:var(--signal); color:var(--signal); background:var(--signal-soft)}
  .legend{margin-top:1.1rem; font-family:var(--f-mono); font-size:.72rem; color:var(--ink-3); display:flex; gap:1.4rem; flex-wrap:wrap}
  .legend span{display:flex; align-items:center; gap:.45rem}
  .swatch{width:.62rem; height:.62rem; border:1px solid var(--rule-strong); flex:none}
  .swatch.local{border-color:var(--signal); background:var(--signal-soft)}
  .swatch.paid{border-color:var(--rule-strong); background:var(--surface)}

  /* practices */
  .practices{display:grid; gap:1px; background:var(--rule); border-block:1px solid var(--rule)}
  .practice{background:var(--paper); padding:1.35rem 0; display:grid; grid-template-columns:6.5rem minmax(0,1fr); gap:0 2rem}
  .practice__i{font-family:var(--f-mono); font-size:.72rem; color:var(--accent); letter-spacing:.12em; padding-top:.3rem}
  .practice h3{font-family:var(--f-display); font-weight:600; font-size:1.05rem; margin:0 0 .4rem}
  .practice p{margin:0; color:var(--ink-2); font-size:.95rem; max-width:62ch}

  /* footer */
  footer{border-top:1px solid var(--rule-strong); padding-block:2.5rem 3.5rem; padding-bottom:calc(3.5rem + env(safe-area-inset-bottom,0px))}
  .foot{display:flex; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; align-items:flex-start}
  .foot p{margin:0; color:var(--ink-3); font-size:.9rem; max-width:44ch}
  .sig{font-family:var(--f-mono); font-size:.79rem; color:var(--ink-2); line-height:1.9}
  .sig b{color:var(--ink); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:.76rem}

  @media (max-width:760px){
    .s-head,.clause,.layer,.practice,figcaption{grid-template-columns:minmax(0,1fr); gap:.55rem}
    .s-num,.clause__i,.layer__l,.practice__i{padding-top:0}
    .facts .fact:not(:first-child){padding-left:0}
    .fact{padding-right:0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
  @media print{
    .bar{display:none}
    body{background:#fff; color:#000; font-size:10.5pt}
    section{break-inside:auto}
    .clause,.cap,.practice{break-inside:avoid}
  }
  /* this page: a longer name than KIA Home, so a smaller title that still fits a phone */
  h1{font-size:clamp(2.1rem,7.4vw,5.25rem); overflow-wrap:break-word}
</style>
</head>

<div class="bar">

</div>

<header class="wrap hero">

  <dl class="facts">

    <div class="fact"><dt data-t="fact.state.k"></dt><dd data-t="fact.state.v"></dd></div>
  </dl>

  <p class="stack"><b>Spring Boot 4.1</b> · <b>Java 21+</b> · <b>Angular 21</b> · <b>PostgreSQL 17</b> · <b>Flyway</b> · <b>Apache POI</b> · <b>Spring Security / JWT</b> · <b>ngx-translate</b> · <b>Playwright</b></p>

  <figure class="hero-figure">

<main>

<section class="wrap">

      <h2 data-t="s4.title"></h2>

<section class="wrap">
  <div class="s-head">

    <div>
      <h2 data-t="s5.title"></h2>
      <p class="lead" data-t="s5.lead"></p>
    </div>
  </div>

  <div class="layer">
    <div class="layer__l" data-t="arch.surfaces"></div>
    <div class="nodes">
      <span class="node" data-t="arch.web"></span>
      <span class="node" data-t="arch.phone"></span>

    "s1.title":"Che cosa fa",
    "s1.lead":"Un solo processo, dall’inizio alla fine: dall’elenco in Excel alla prova che si presenta durante un controllo. Base legale: art. 5 della legge sui lavoratori distaccati (LDist) e art. 8b della relativa ordinanza (ODist).",
    "cap.light.l":"Semaforo per cantiere",
    "cap.light.t":"Verde: il dossier è completo. Arancione: un documento scade nei prossimi 30 giorni. Rosso: un documento manca o è scaduto. Un cantiere prende il colore del dossier più debole della sua catena.",
    "cap.chain.l":"Tutta la catena",
    "cap.chain.t":"La responsabilità copre anche i subappaltatori dei subappaltatori. Ogni ditta sta sotto quella che l’ha incaricata, per quanto profonda sia la catena.",
    "cap.file.l":"Il dossier di ogni ditta",
    "cap.file.t":"Dichiarazioni SECO, attestati Suva, AVS e LPP, attestato ISAB: che cosa è valido, fino a quando, chi l’ha verificato e quando, con la scansione del documento.",
    "cap.mail.l":"Promemoria nella lingua della ditta",
    "cap.mail.t":"Per ogni ditta con documenti mancanti o in scadenza l’e-mail è già scritta, in tedesco o in francese a seconda della ditta. Parte dal programma di posta dell’utente; l’applicazione non invia nulla da sola.",
    "cap.check.l":"Il controllo in cantiere",
    "cap.check.t":"Sul telefono: si toccano le ditte presenti e se ne aggiunge una sconosciuta. L’applicazione mostra subito chi ha il dossier incompleto, e il controllo viene salvato con data e ora.",
    "cap.excel.l":"Da Excel alla prova",
    "cap.excel.t":"L’elenco esistente viene ripreso così com’è, con un’anteprima prima del salvataggio. Alla fine: una pagina da stampare con tutte le prove di un cantiere.",

    "s2.title":"L’applicazione",
    "s2.lead":"Schermate della demo, con dati inventati. Ditte, persone, indirizzi e numeri IDI (CHE-000.000.1xx) sono immaginari, e gli indirizzi e-mail finiscono in .example, il dominio riservato dalla RFC 2606. L’interfaccia dell’applicazione esiste in tedesco e in francese: la pagina francese mostra le schermate in francese, le altre lingue quelle in tedesco.",
    "fig.n1":"Fig. 1","fig.n2":"Fig. 2","fig.n3":"Fig. 3","fig.n4":"Fig. 4","fig.n5":"Fig. 5","fig.n6":"Fig. 6","fig.n7":"Fig. 7","fig.n8":"Fig. 8","fig.n9":"Fig. 9",
    "fig.excel":"Il punto di partenza: l’elenco dei subappaltatori come lo tengono molte imprese. Una riga per ditta, una colonna per documento, le celle colorate a mano. Il colore non cambia da solo quando una data passa.",
    "fig.import":"Lo stesso file all’importazione. Prima compare solo ciò che cambierebbe: nuove ditte, nuovi cantieri, documenti ripresi. Si salva qualcosa solo dopo la conferma.",
    "fig.dashboard":"La panoramica. Sotto i cantieri, l’elenco «Handlungsbedarf» (da fare): a chi manca un documento o a chi sta per scadere, con la data di scadenza.",
    "fig.chain":"La catena di un cantiere. L’agenzia di personale chiamata dall’elettricista sta sotto di lui, e le mancano due documenti. Proprio il caso che una tabella con una riga per ditta non mostra.",
    "fig.list":"Tutti i subappaltatori, i più urgenti per primi, con la prossima scadenza.",
    "fig.file":"Il dossier di una ditta: ogni documento richiesto, con la sua base (art. 8b ODist o raccomandazione della Suva), lo stato e la data. La dichiarazione sui salari può essere sostituita dall’attestato ISAB, per questo stanno sulla stessa riga. I documenti facoltativi mancanti sono grigi, non rossi.",
    "fig.reminders":"I promemoria: uno per ditta, non uno per documento. La ditta di Romont riceve il testo in francese, anche se l’interfaccia è in tedesco.",
    "fig.check":"Il controllo in cantiere, sul telefono, prima e dopo il salvataggio. Una ditta che lavora in cantiere ma non è nella catena compare come «Nicht erfasst» (non registrata): è il caso più grave, non il più lieve.",
    "fig.proof":"La prova per un controllo: tutte le ditte di un cantiere, ogni documento con data di emissione, validità e chi l’ha verificato. Pensata per la stampa.",

    "s3.title":"Scelte di progettazione",
    "s3.lead":"L’applicazione è piccola. Ciò che vale la pena mostrare sono le decisioni sottostanti: ognuna presa perché la variante più semplice avrebbe dato, prima o poi, una risposta sbagliata.",
    "c1.t":"Lo stato si calcola, non si salva",
    "c1.b":"Nessuna colonna contiene «completo» o «scaduto». <code>DossierEvaluator</code> riceve i tipi di documento e le prove presenti e restituisce lo stato: logica pura, senza database. Uno stato salvato andrebbe aggiornato ogni notte e sarebbe sbagliato tra due aggiornamenti; uno calcolato è giusto il giorno in cui lo si legge.",
    "c1.m":"La regola: per ogni requisito conta il documento valido più a lungo. Sotto i <em>30 giorni</em> è arancione, scaduto o mancante è rosso, e solo i requisiti obbligatori decidono il colore. Coperta da 6 test unitari.",
    "c2.t":"Alternative, non solo documenti",
    "c2.b":"L’ordinanza accetta la dichiarazione sui salari oppure, dal 2023, l’attestato ISAB al suo posto. I documenti sono quindi raggruppati per requisito (<code>requirement_group</code>), e un requisito è soddisfatto da uno qualsiasi dei suoi documenti. Una ditta con l’attestato ISAB non compare in rosso solo perché le manca anche la dichiarazione.",
    "c3.t":"La catena è un albero",
    "c3.b":"Ogni presenza su un cantiere ha un <code>parent_id</code> verso la presenza della ditta che l’ha incaricata. Una tabella piatta non può dire «lavora per l’elettricista»; un albero sì, a qualsiasi profondità. E cancellare un livello porta via anche quelli sotto.",
    "c4.t":"L’anteprima è l’importazione vera, annullata",
    "c4.b":"L’anteprima non è un secondo algoritmo che indovina che cosa farebbe l’importazione. Esegue esattamente lo stesso codice, nella stessa transazione, che alla fine viene marcata con <code>setRollbackOnly()</code>. Ciò che mostra l’anteprima è quindi, per costruzione, ciò che si salva alla conferma.",
    "c5.t":"Il controllo conserva il passato",
    "c5.b":"Al salvataggio di un controllo, lo stato di ogni dossier viene copiato nella riga del controllo. Un dossier completato domani non riscrive il fatto che oggi, in cantiere, era incompleto. È proprio la domanda di un controllo: che cosa si sapeva e quando.",
    "c6.t":"Promemoria senza pianificatore e senza invio automatico",
    "c6.b":"L’elenco dei promemoria si calcola all’apertura, dallo stesso stato della panoramica; non c’è un’elaborazione notturna. L’applicazione non invia nemmeno e-mail: apre il programma di posta dell’utente con il testo pronto. Un’e-mail sbagliata, inviata automaticamente a un subappaltatore, è peggio di una letta prima da una persona.",
    "c7.t":"I dati della demo si ripristinano da soli",
    "c7.b":"Un pulsante svuota le tabelle (<code>TRUNCATE</code>) e rilancia Flyway, che ricarica i dati inventati. Le date sono relative al giorno corrente, così la demo mostra sempre un documento che scade tra pochi giorni, non uno scaduto da un anno.",
    "c8.t":"L’elenco dei documenti non è scritto nel codice",
    "c8.b":"I tipi di documento stanno in una tabella: nome in tedesco e in francese, base legale, validità abituale e se sono obbligatori. L’elenco della demo segue le dichiarazioni modello della SECO e le raccomandazioni della Suva e porta la dicitura «esempio, non consulenza legale». Un’impresa vera lo stabilisce con la propria associazione professionale.",

    "s4.title":"Misurato, non affermato",
    "s4.lead":"Contato nel repository il giorno in cui è stata scritta questa pagina. Il metodo è descritto nel README, perché il prossimo conteggio sia lo stesso.",
    "tbl.item":"Voce","tbl.value":"Valore","tbl.note":"Osservazione",

    "m2.k":"Test automatici","m2.n":"13 metodi di test nel backend, 2 spec nel frontend",
    "m3.k":"Migrazioni del database","m3.n":"Flyway; l’ORM non modifica mai lo schema",

  en: {
    "app.name":"Subunternehmer-Dossier",
    "hero.eyebrow":"Web application · designed and built by one person · demo with invented data",
    "hero.deck":"In Switzerland, the main contractor is liable for unpaid wages of all its subcontractors, down the whole chain — unless it can prove it requested and checked their documents. In many firms that proof is an Excel sheet coloured by hand. <strong>The application keeps each subcontractor's file and works out, every time it is opened, what is missing and what is about to expire.</strong>",
    "hero.label":"Opening",
    "hero.caption":"The overview: each site takes the colour of the weakest file in its chain, and below it is the list of firms that need to be asked for something. The same view appears below as fig. 3.",
    "fact.role.k":"Role","fact.role.v":"Analysis, architecture, development",
    "fact.period.k":"Period","fact.period.v":"October 2026",
    "fact.scale.k":"Size","fact.scale.v":"6,023 lines, 15 tests",
    "fact.state.k":"State","fact.state.v":"Working demo, invented data",

    "s1.title":"What it does",
    "s1.lead":"One process, end to end: from the Excel list to the proof you show at an inspection. Legal basis: Art. 5 of the Posted Workers Act (EntsG) and Art. 8b of its ordinance (EntsV).",
    "cap.light.l":"Traffic light per site",
    "cap.light.t":"Green: the file is complete. Orange: a document expires within the next 30 days. Red: a document is missing or has expired. A site takes the colour of the weakest file in its chain.",
    "cap.chain.l":"The whole chain",
    "cap.chain.t":"Liability also covers the subcontractors' subcontractors. Each firm sits under the one that hired it, however deep the chain goes.",
    "cap.file.l":"Every firm's file",
    "cap.file.t":"SECO declarations, Suva, AHV and BVG certificates, the ISAB certificate: what is valid, until when, who checked it and when, plus the scan of the document.",
    "cap.mail.l":"Reminders in the firm's language",
    "cap.mail.t":"For every firm with missing or expiring documents the email is ready, in German or French depending on the firm. It goes out from the user's own mail program; the application sends nothing by itself.",
    "cap.check.l":"The on-site check",
    "cap.check.t":"On a phone: tap the firms on site and add an unknown one. The application shows at once whose file is incomplete, and the check is saved with date and time.",
    "cap.excel.l":"From Excel to proof",
    "cap.excel.t":"The existing list is taken over as it is, with a preview before anything is saved. At the end: a printable page with all the proof for one site.",

    "s2.title":"The application",
    "s2.lead":"Screenshots of the demo, with invented data. Firms, people, addresses and UID numbers (CHE-000.000.1xx) are made up, and the email addresses end in .example, the domain reserved by RFC 2606. The application's interface exists in German and French: the French page shows the French screenshots, every other language the German ones.",
    "fig.n1":"Fig. 1","fig.n2":"Fig. 2","fig.n3":"Fig. 3","fig.n4":"Fig. 4","fig.n5":"Fig. 5","fig.n6":"Fig. 6","fig.n7":"Fig. 7","fig.n8":"Fig. 8","fig.n9":"Fig. 9",
    "fig.excel":"The starting point: the subcontractor list as many firms keep it. One row per firm, one column per document, the cells coloured by hand. The colour does not change by itself when a date passes.",
    "fig.import":"The same file, imported. First you see only what would change: new firms, new sites, documents taken over. Nothing is saved until you confirm.",
    "fig.dashboard":"The overview. Below the sites, the “Handlungsbedarf” (action needed) list: who is missing a document or has one about to expire, with the expiry date.",
    "fig.chain":"The chain for one site. The staffing agency brought in by the electrician sits under him, and it is missing two documents. Exactly the case a table with one row per firm cannot show.",
    "fig.list":"All subcontractors, the most urgent first, with the next expiry date.",
    "fig.file":"One firm's file: every required document with its basis (Art. 8b EntsV or Suva's recommendation), its state and its date. The wage declaration can be replaced by the ISAB certificate, which is why both share a row. Missing optional documents are grey, not red.",
    "fig.reminders":"The reminders: one per firm, not one per document. The firm from Romont gets the text in French, even though the interface is in German.",
    "fig.check":"The on-site check on a phone, before and after saving. A firm working on site that is not in the chain shows up as “Nicht erfasst” (not registered): the most serious case, not the mildest.",
    "fig.proof":"The proof for an inspection: every firm on one site, each document with its issue date, its validity and who checked it. Made for printing.",

    "s3.title":"Design decisions",
    "s3.lead":"The application is small. What is worth showing are the decisions underneath: each was made because the simpler option would, at some point, have given a wrong answer.",
    "c1.t":"The state is computed, not stored",
    "c1.b":"No column holds “complete” or “expired”. <code>DossierEvaluator</code> takes the document types and the evidence on file and returns the state: pure logic, no database. A stored state would need updating every night and would be wrong between two updates; a computed one is right on the day you read it.",
    "c1.m":"The rule: for each requirement, the document valid longest counts. Under <em>30 days</em> it is orange, expired or missing it is red, and only mandatory requirements decide the colour. Covered by 6 unit tests.",
    "c2.t":"Alternatives, not just documents",
    "c2.b":"The ordinance accepts the wage declaration or, since 2023, the ISAB certificate in its place. Documents are therefore grouped by requirement (<code>requirement_group</code>), and a requirement is met by any of its documents. A firm with an ISAB certificate does not turn red just because it also lacks the declaration.",
    "c3.t":"The chain is a tree",
    "c3.b":"Every assignment on a site has a <code>parent_id</code> pointing to the assignment of the firm that hired it. A flat table cannot say “works for the electrician”; a tree can, at any depth. And deleting one level takes the ones below with it.",
    "c4.t":"The preview is the real import, rolled back",
    "c4.b":"The preview is not a second algorithm guessing what the import would do. It runs exactly the same code, in the same transaction, which is marked <code>setRollbackOnly()</code> at the end. What the preview shows is therefore, by construction, what gets saved when you confirm.",
    "c5.t":"The check keeps the past",
    "c5.b":"When a check is saved, the state of each file is copied into the check's row. A file completed tomorrow does not rewrite the fact that today, on site, it was incomplete. That is exactly the question at an inspection: what did you know, and when.",
    "c6.t":"Reminders with no scheduler and no automatic sending",
    "c6.b":"The reminder list is computed when it is opened, from the same state as the overview; there is no nightly job. Nor does the application send emails: it opens the user's mail program with the text ready. A wrong email sent automatically to a subcontractor is worse than one a person read first.",
    "c7.t":"The demo data restores itself",
    "c7.b":"One button empties the tables (<code>TRUNCATE</code>) and runs Flyway again, which reloads the invented data. Dates are relative to today, so the demo always shows a document expiring in a few days, not one that expired a year ago.",
    "c8.t":"The document list is not written in code",
    "c8.b":"The document types live in a table: name in German and French, legal basis, usual validity and whether they are mandatory. The demo's list follows SECO's model declarations and Suva's recommendations and carries the note “example, not legal advice”. A real firm settles it with its trade association.",

    "s4.title":"Measured, not claimed",
    "s4.lead":"Counted in the repository on the day this page was written. The method is in the README, so the next count is the same count.",
    "tbl.item":"Item","tbl.value":"Value","tbl.note":"Note",
    "m1.k":"Lines of code","m1.n":"Java, TypeScript, HTML, SCSS, SQL",
    "m2.k":"Automated tests","m2.n":"13 test methods in the backend, 2 specs in the frontend",
    "m3.k":"Database migrations","m3.n":"Flyway; the ORM never changes the schema",
    "m4.k":"Document types","m4.n":"in 7 requirements, after SECO and Suva",
    "m5.k":"Screens","m5.n":"including the phone check and the printable page",
    "m6.k":"Interface languages","m6.n":"German and French, 144 keys each",

    "s5.title":"Architecture",
    "s5.lead":"A Spring Boot core and a single database, which also holds the scans. No external services: nothing leaves the server.",
    "arch.surfaces":"Surfaces",
    "arch.core":"Core",
    "arch.store":"Storage",
    "arch.web":"Web (Angular 21)",
    "arch.phone":"Phone (the same web app, its own layout)",
    "arch.excel":"Excel import (Apache POI)",

    "arch.core.node":"Spring Boot 4.1 — 16 services, 7 REST controllers, JWT",
    "arch.blob":"Scans kept in the database (BYTEA)",

    "foot.note":"Demo with invented data. Not legal advice. The source code is in a private repository.",
    "foot.updated":"Updated: October 2026"

  ro: {
    "app.name":"Subunternehmer-Dossier",
    "hero.eyebrow":"Aplicație web · proiectată și dezvoltată de o singură persoană · demo cu date inventate",
    "hero.deck":"În Elveția, antrepriza generală răspunde pentru salariile neplătite de toți subcontractorii ei, pe tot lanțul — dacă nu poate dovedi că le-a cerut și verificat documentele. În multe firme, dovada aceasta e un tabel Excel colorat de mână. <strong>Aplicația ține dosarul fiecărui subcontractor și calculează, la fiecare deschidere, ce lipsește și ce expiră.</strong>",
    "hero.label":"Deschidere",
    "hero.caption":"Tabloul de bord: fiecare șantier are culoarea celui mai slab dosar din lanțul lui, iar dedesubt stă lista firmelor de la care trebuie cerut ceva. Aceeași vedere apare ca fig. 3 mai jos.",
    "fact.role.k":"Rol","fact.role.v":"Analiză, arhitectură, dezvoltare",
    "fact.period.k":"Perioadă","fact.period.v":"Octombrie 2026",
    "fact.scale.k":"Dimensiune","fact.scale.v":"6 023 de linii, 15 teste",
    "fact.state.k":"Stadiu","fact.state.v":"Demo funcțional, date inventate",

    "s1.title":"Ce face",
    "s1.lead":"Un singur proces, de la capăt la capăt: de la lista din Excel până la dovada pe care o arăți la un control. Temeiul legal: art. 5 din legea detașării (EntsG) și art. 8b din ordonanța ei (EntsV).",
    "cap.light.l":"Semafor pe șantiere",
    "cap.light.t":"Verde: dosarul e complet. Portocaliu: un document expiră în următoarele 30 de zile. Roșu: un document lipsește sau a expirat. Un șantier ia culoarea celui mai slab dosar din lanțul lui.",
    "cap.chain.l":"Tot lanțul",
    "cap.chain.t":"Răspunderea acoperă și subcontractorii subcontractorilor. Fiecare firmă stă sub cea care a angajat-o, oricât de adânc ar merge lanțul.",
    "cap.file.l":"Dosarul fiecărei firme",
    "cap.file.t":"Declarațiile SECO, atestatele Suva, AVS și LPP, certificatul ISAB: ce e valabil, până când, cine l-a verificat și când, plus scanarea documentului.",
    "cap.mail.l":"Memento-uri în limba firmei",
    "cap.mail.t":"Pentru fiecare firmă cu documente lipsă sau pe cale să expire, emailul e gata scris, în germană sau în franceză, după firmă. Pleacă din programul de email al utilizatorului; aplicația nu trimite nimic singură.",
    "cap.check.l":"Controlul pe șantier",
    "cap.check.t":"Pe telefon: bifezi firmele prezente și adaugi una necunoscută. Aplicația arată imediat cine are dosarul incomplet, iar controlul se păstrează cu data și ora.",
    "cap.excel.l":"De la Excel la dovadă",
    "cap.excel.t":"Lista existentă se importă așa cum e, cu o previzualizare înainte de salvare. La capăt: o pagină de tipărit cu toate dovezile unui șantier.",

    "s2.title":"Aplicația",
    "s2.lead":"Capturi din demo, cu date inventate. Firmele, persoanele, adresele și numerele UID (CHE-000.000.1xx) sunt născocite, iar adresele de email se termină în .example, domeniul rezervat de RFC 2606. Interfața aplicației există în germană și în franceză: pagina în franceză arată capturile în franceză, celelalte limbi pe cele în germană.",
    "fig.n1":"Fig. 1","fig.n2":"Fig. 2","fig.n3":"Fig. 3","fig.n4":"Fig. 4","fig.n5":"Fig. 5","fig.n6":"Fig. 6","fig.n7":"Fig. 7","fig.n8":"Fig. 8","fig.n9":"Fig. 9",
    "fig.excel":"Punctul de plecare: lista subcontractorilor așa cum o țin multe firme. Un rând pe firmă, o coloană pe document, celulele colorate de mână. Culoarea nu se schimbă singură când trece o dată.",
    "fig.import":"Același fișier, la import. Întâi apare doar ce s-ar schimba: firme noi, șantiere noi, documente preluate. Abia după confirmare se salvează ceva.",
    "fig.dashboard":"Tabloul de bord. Sub șantiere, lista „Handlungsbedarf”: cine are un document lipsă sau pe cale să expire, cu data expirării.",
    "fig.chain":"Lanțul unui șantier. Firma de personal angajată de electrician stă sub el, iar ei îi lipsesc două documente. Exact cazul pe care un tabel cu un rând pe firmă nu-l arată.",
    "fig.list":"Toți subcontractorii, cei mai urgenți primii, cu următoarea dată de expirare.",
    "fig.file":"Dosarul unei firme: fiecare document cerut, cu temeiul lui (art. 8b EntsV sau recomandarea Suva), starea și data. Declarația de salariu poate fi înlocuită de certificatul ISAB, de aceea apar pe același rând. Documentele opționale care lipsesc sunt gri, nu roșii.",
    "fig.reminders":"Memento-urile: unul pentru fiecare firmă, nu pentru fiecare document. Firma din Romont primește textul în franceză, chiar dacă interfața e în germană.",
    "fig.check":"Controlul pe șantier, pe telefon, înainte și după salvare. O firmă care lucrează pe șantier, dar nu e în lanț, apare ca „Nicht erfasst”: e cazul cel mai grav, nu cel mai ușor.",
    "fig.proof":"Dovada pentru un control: toate firmele unui șantier, fiecare document cu data emiterii, valabilitatea și cine l-a verificat. Gândită pentru tipărire.",

    "s3.title":"Decizii de proiectare",
    "s3.lead":"Aplicația e mică. Ce merită arătat sunt deciziile de dedesubt: fiecare a fost luată pentru că varianta mai simplă ar fi dat, la un moment dat, un răspuns greșit.",
    "c1.t":"Starea se calculează, nu se salvează",
    "c1.b":"Nicio coloană nu ține „complet” sau „expirat”. <code>DossierEvaluator</code> primește tipurile de documente și dovezile existente și întoarce starea: logică pură, fără bază de date. O stare salvată ar trebui actualizată în fiecare noapte și ar fi greșită între două actualizări; una calculată e corectă în ziua în care o citești.",
    "c1.m":"Regula: pentru fiecare cerință contează documentul valabil cel mai mult timp. Sub <em>30 de zile</em> e portocaliu, expirat sau lipsă e roșu, și doar cerințele obligatorii decid culoarea. Acoperită de 6 teste unitare.",
    "c2.t":"Alternative, nu doar documente",
    "c2.b":"Ordonanța acceptă declarația de salariu sau, din 2023, certificatul ISAB în locul ei. Documentele sunt deci grupate pe cerințe (<code>requirement_group</code>), iar o cerință e îndeplinită de oricare dintre documentele ei. O firmă cu certificat ISAB nu apare roșie doar pentru că nu are și declarația.",

const SUPPORTED = Object.keys(I18N);
const STORE_KEY = "subdossier.presentation.lang";

// The application's interface exists in German and French only: the French page shows
// the French figures, every other language the German ones.
const SHOT_LANG = { fr: "fr" };

// Bumped whenever the figures are retaken: GitHub Pages serves them with
// Cache-Control max-age=600 under the same addresses, so without a new token a
// browser that has seen the page before goes on showing the figures it holds.
const SHOTS_VERSION = "2026-10-12b";

function apply(lang){
  const t = I18N[lang];
  if(!t) return;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(v !== undefined) el.textContent = v;
  });
  document.querySelectorAll("[data-h]").forEach(el=>{
    const v = t[el.dataset.h];
    if(v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll(".langs button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  document.querySelectorAll("img[data-shot]").forEach(img=>{
    const next = "shots/" + (SHOT_LANG[lang] || "de") + "/" + img.dataset.shot + ".png?v=" + SHOTS_VERSION;
    if(img.getAttribute("src") !== next) img.setAttribute("src", next);
  });
  try{ localStorage.setItem(STORE_KEY, lang); }catch(e){}
}

function initialLang(){
  const hash = location.hash.replace("#","").toLowerCase();
  if(SUPPORTED.includes(hash)) return hash;
  try{
    const saved = localStorage.getItem(STORE_KEY);
    if(saved && SUPPORTED.includes(saved)) return saved;
  }catch(e){}
  for(const l of (navigator.languages || [navigator.language || ""])){
    const code = String(l).slice(0,2).toLowerCase();
    if(SUPPORTED.includes(code)) return code;
  }
  return SUPPORTED.includes("de") ? "de" : SUPPORTED[0];
}

document.querySelectorAll(".langs button").forEach(b=>{
  if(!SUPPORTED.includes(b.dataset.lang)) b.hidden = true;
  b.addEventListener("click", ()=>apply(b.dataset.lang));
});
window.addEventListener("hashchange", ()=>{
  const h = location.hash.replace("#","").toLowerCase();
  if(SUPPORTED.includes(h)) apply(h);
});
apply(initialLang());
</script>
